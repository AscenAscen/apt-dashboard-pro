name: 공급 자료 수집 (청약홈) · 사이트 배포

# 매주 월요일 새벽에 청약홈 분양 공고·주택형별 분양가·경쟁률을 받아 data/supply.json 으로 저장합니다.
# (인구는 실거래 수집(update.yml) 때 한 달에 한 번 scripts/population.py 가 받습니다)
on:
  schedule:
    - cron: '20 19 * * 0'    # 매주 월요일 04:20 (한국 시간)
  workflow_dispatch:         # Actions 화면에서 [Run workflow] 로 직접 실행

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apt-supply
  cancel-in-progress: false

jobs:
  collect:
    name: 청약홈 공급 자료 받기
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 청약홈 → data/supply.json
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: python scripts/supply.py
      - name: 바뀐 파일 저장(커밋)
        run: |
          git config user.name "apt-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in data/supply.json data/supply_status.json; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -q -m "공급 자료 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

  deploy:
    name: 사이트 배포
    concurrency:
      group: pages-deploy      # 수집·변환 작업들이 동시에 배포하면 서로 부딪힘 → 한 번에 하나씩
      cancel-in-progress: false
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub 쪽이 잠깐 불안정하면 "No artifacts named github-pages" 오류가 날 수 있어 → 1분 쉬고 한 번, 3분 쉬고 한 번 더 시도
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: 배포 실패 → 1분 뒤 다시 시도
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: 또 실패 → 3분 뒤 마지막 시도
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 180
      - id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
