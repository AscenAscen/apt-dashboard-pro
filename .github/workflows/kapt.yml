name: K-apt 세대수 변환 · 사이트 배포

# kapt/ 폴더에 K-apt 전국 단지 엑셀(공동주택 단지 면적 정보)을 올리면 단지별 세대수(data/kapt/*.json)로 바꾸고 사이트를 다시 배포합니다.
on:
  push:
    branches: [main]
    paths: ['kapt/**']
  workflow_dispatch:         # Actions 화면에서 [Run workflow] 로 직접 실행

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apt-kapt
  cancel-in-progress: false

jobs:
  convert:
    name: K-apt 엑셀 변환
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: 엑셀 → data/kapt/*.json (가장 최근 파일만 남김)
        run: python scripts/kapt_file.py --keep-latest
      - name: 단지 수 탭 자료 다시 만들기 (실패해도 계속 진행)
        continue-on-error: true
        run: python scripts/count_summary.py
      - name: 바뀐 파일 저장(커밋)
        run: |
          git config user.name "apt-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/kapt data/kapt_file_status.json kapt
          [ -e data/count.json ] && git add data/count.json
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -q -m "K-apt 세대수 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

  deploy:
    name: 사이트 배포
    concurrency:
      group: pages-deploy      # 수집·변환 작업들이 동시에 배포하면 서로 부딪힘 → 한 번에 하나씩
      cancel-in-progress: false
    needs: convert
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub 쪽이 잠깐 불안정하면 "No artifacts named github-pages" 오류가 날 수 있어 → 1분 쉬고 한 번, 3분 쉬고 한 번 더 시도
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: 배포 실패 → 1분 뒤 다시 시도
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: 또 실패 → 3분 뒤 마지막 시도
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 180
      - id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
