name: 인구이동 수집 (KOSIS) · 사이트 배포

# 매주 화요일 새벽에 통계청 KOSIS 국내인구이동통계(시군구 전입·전출·순이동, 시도 간 이동)를 받아 data/migration.json 으로 저장합니다.
# 통계는 보통 다음 달 말에 나오므로, 매주 확인해서 새 달이 나오면 바로 반영됩니다.
# 키: GitHub → Settings → Secrets and variables → Actions → KOSIS_API_KEY
on:
  schedule:
    - cron: '40 19 * * 1'    # 매주 화요일 04:40 (한국 시간)
  workflow_dispatch:         # Actions 화면에서 [Run workflow] 로 직접 실행

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apt-migration
  cancel-in-progress: false

jobs:
  collect:
    name: KOSIS 인구이동 받기
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: KOSIS → data/migration.json
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python scripts/migration.py
      - name: 바뀐 파일 저장(커밋)
        run: |
          git config user.name "apt-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in data/migration.json data/migration_status.json; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -q -m "인구이동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

  deploy:
    name: 사이트 배포
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
