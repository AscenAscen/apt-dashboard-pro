<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단지 윤곽 시험 페이지</title>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 14px; color: #222; }
  #app { display: flex; height: 100%; }
  #side { width: 340px; min-width: 340px; height: 100%; overflow-y: auto; padding: 14px; background: #f6f7f9; border-right: 1px solid #ddd; }
  #map { flex: 1; height: 100%; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #777; font-size: 12px; margin-bottom: 12px; }
  .box { background: #fff; border: 1px solid #e2e4e8; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .box h2 { font-size: 13px; margin: 0 0 8px; color: #444; }
  label { display: block; font-size: 12px; color: #555; margin: 6px 0 2px; }
  input[type=text], select { width: 100%; padding: 7px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  .row { display: flex; gap: 6px; }
  .row input { flex: 1; }
  button { padding: 7px 12px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: 13px; cursor: pointer; white-space: nowrap; }
  button.gray { background: #6b7280; }
  button.on { background: #e5322d; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 4px 0; color: #333; }
  #results { list-style: none; margin: 8px 0 0; padding: 0; max-height: 260px; overflow-y: auto; }
  #results li { padding: 7px 8px; border-radius: 6px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
  #results li:hover { background: #eef3ff; }
  #results .nm { font-weight: 600; }
  #results .ad { font-size: 11px; color: #888; }
  #results .apt { color: #e5322d; font-size: 11px; margin-left: 4px; }
  #status { font-size: 13px; line-height: 1.5; white-space: pre-line; }
  #status.err { color: #c62828; }
  #log { font-size: 11px; max-height: 300px; overflow: auto; background: #111; color: #9fe39f; padding: 8px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
  .dong { background: #fff; border: 1.5px solid #e5322d; color: #e5322d; font-weight: 700; font-size: 12px; padding: 1px 6px; border-radius: 10px; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.2); transform: translateY(50%); }
  .dong.other { border-color: #999; color: #777; font-weight: 500; font-size: 11px; }
  .hint { font-size: 12px; color: #777; margin-top: 6px; line-height: 1.5; }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>단지 윤곽 시험 페이지</h1>
    <div class="sub">단지 경계선 + 동 번호 표시 시험용 (본 대시보드와 별개)</div>

    <details class="box" id="keyBox">
      <summary><b>① 키 설정</b> (처음 한 번만)</summary>
      <label>카카오맵 JavaScript 키</label>
      <input type="text" id="kakaoKey" placeholder="대시보드에서 쓰는 카카오 JavaScript 키">
      <label>브이월드 인증키</label>
      <input type="text" id="vworldKey" placeholder="브이월드 인증키">
      <label>브이월드 등록 도메인 (보통 그대로 두면 됨)</label>
      <input type="text" id="vworldDomain">
      <div style="margin-top:8px"><button id="saveKeys">저장하고 다시 불러오기</button></div>
      <div class="hint">키는 이 브라우저에만 저장됩니다.</div>
    </details>

    <div class="box">
      <h2>② 단지 검색</h2>
      <div class="row">
        <input type="text" id="q" placeholder="예: 래미안베라힐즈">
        <button id="searchBtn">검색</button>
      </div>
      <ul id="results"></ul>
    </div>

    <div class="box">
      <h2>③ 표시 옵션</h2>
      <label class="chk"><input type="checkbox" id="optDong" checked> 동 번호 표시</label>
      <label class="chk"><input type="checkbox" id="optOther"> 상가·관리동 등도 표시 (회색)</label>
      <label class="chk"><input type="checkbox" id="optParcel"> 필지 경계 따로 보기 (확인용)</label>
      <label class="chk"><input type="checkbox" id="optBld"> 건물 모양 보기 (확인용)</label>
      <label>주변 건물 찾는 반경</label>
      <select id="radius">
        <option value="200">200m</option>
        <option value="300" selected>300m</option>
        <option value="500">500m</option>
      </select>
      <label>건물 데이터 종류 (안 되면 바꿔서 시험)</label>
      <select id="bldLayer">
        <option value="LT_C_SPBD" selected>도로명주소 건물 (LT_C_SPBD)</option>
        <option value="LT_C_BLDGINFO">건물통합정보 (LT_C_BLDGINFO)</option>
      </select>
    </div>

    <div class="box">
      <h2>④ 경계가 이상할 때</h2>
      <button id="manualBtn" class="gray">지도 클릭으로 필지 추가/빼기: 꺼짐</button>
      <div class="hint">켜고 지도에서 땅을 누르면, 그 필지가 단지 경계에 들어가거나 빠집니다.</div>
      <div style="margin-top:6px"><button id="clearBtn" class="gray">모두 지우기</button></div>
    </div>

    <div class="box">
      <h2>상태</h2>
      <div id="status">키를 확인하는 중…</div>
    </div>

    <details class="box">
      <summary><b>확인용 정보</b> (안 될 때 이 내용을 복사해서 보내 주세요)</summary>
      <pre id="log"></pre>
    </details>
  </aside>
  <div id="map"></div>
</div>

<script>
(function () {
  const LS = 'outlineTest.';
  const $ = (id) => document.getElementById(id);

  const cfg = {
    kakao: localStorage.getItem(LS + 'kakao') || '',
    vworld: localStorage.getItem(LS + 'vworld') || '',
    domain: localStorage.getItem(LS + 'domain') || location.origin
  };
  $('kakaoKey').value = cfg.kakao;
  $('vworldKey').value = cfg.vworld;
  $('vworldDomain').value = cfg.domain;

  $('saveKeys').onclick = () => {
    localStorage.setItem(LS + 'kakao', $('kakaoKey').value.trim());
    localStorage.setItem(LS + 'vworld', $('vworldKey').value.trim());
    localStorage.setItem(LS + 'domain', $('vworldDomain').value.trim() || location.origin);
    location.reload();
  };

  // ---------- 상태 / 로그 ----------
  function setStatus(msg, isErr) {
    $('status').textContent = msg;
    $('status').className = isErr ? 'err' : '';
  }
  function log(...a) {
    const s = a.map((x) => (typeof x === 'string' ? x : JSON.stringify(x, null, 1))).join(' ');
    $('log').textContent += s + '\n';
  }

  if (!cfg.kakao || !cfg.vworld) {
    $('keyBox').open = true;
    setStatus('① 키 설정에 카카오 JavaScript 키와 브이월드 키를 넣고 저장해 주세요.');
    return;
  }

  // ---------- 카카오맵 불러오기 ----------
  function loadKakao(key) {
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(key) + '&libraries=services&autoload=false';
      s.onload = () => kakao.maps.load(res);
      s.onerror = () => rej(new Error('카카오맵을 불러오지 못했습니다. 키 또는 카카오 개발자 사이트의 도메인 등록을 확인하세요.'));
      document.head.appendChild(s);
    });
  }

  // ---------- 브이월드 (JSONP) ----------
  let seq = 0;
  function vworld(params) {
    return new Promise((resolve, reject) => {
      const cb = '__vw' + (++seq) + '_' + Date.now();
      const q = new URLSearchParams(Object.assign({
        service: 'data', request: 'GetFeature', version: '2.0', format: 'json',
        crs: 'EPSG:4326', geometry: 'true', attribute: 'true', size: '1000', page: '1',
        key: cfg.vworld, domain: cfg.domain, callback: cb
      }, params));
      const s = document.createElement('script');
      const timer = setTimeout(() => { cleanup(); reject(new Error('브이월드 응답 시간 초과')); }, 15000);
      function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
      window[cb] = (data) => { cleanup(); resolve(data); };
      s.onerror = () => { cleanup(); reject(new Error('브이월드 요청 실패 (키·도메인 확인)')); };
      s.src = 'https://api.vworld.kr/req/data?' + q.toString();
      document.head.appendChild(s);
    });
  }
  function featuresOf(data) {
    const r = data && data.response;
    if (!r) throw new Error('브이월드 응답 형식이 예상과 다릅니다');
    if (r.status === 'NOT_FOUND') return [];
    if (r.status !== 'OK') throw new Error('브이월드 오류: ' + JSON.stringify(r.error || r.status));
    return (r.result && r.result.featureCollection && r.result.featureCollection.features) || [];
  }
  async function fetchAll(dataId, geomFilter) {
    let out = [];
    for (let page = 1; page <= 5; page++) {
      const d = await vworld({ data: dataId, geomFilter: geomFilter, page: String(page) });
      out = out.concat(featuresOf(d));
      const total = Number((d.response.page && d.response.page.total) || 1);
      if (page >= total) break;
    }
    return out;
  }

  // ---------- 속성 읽기 ----------
  const NAME_KEYS = ['buld_nm', 'bld_nm', 'bldg_nm', 'build_nm'];
  const DONG_KEYS = ['buld_nm_dc', 'dong_nm', 'bld_dong_nm', 'dongnm'];
  const FLOOR_KEYS = ['gro_flo_co', 'grnd_flr', 'ground_floor', 'flo_co'];
  function pick(p, keys) {
    p = p || {};
    for (const k of keys) {
      if (p[k] != null && String(p[k]).trim() !== '') return String(p[k]).trim();
    }
    return '';
  }
  function norm(s) {
    return (s || '').replace(/\(.*?\)/g, '').replace(/\s/g, '').replace(/아파트|apt/gi, '').toLowerCase();
  }
  function dongLabel(p) {
    let s = pick(p, DONG_KEYS);
    if (!s) {
      const m = pick(p, NAME_KEYS).match(/(\d{1,4})\s*동/);
      if (m) s = m[1] + '동';
    }
    if (!s) return { text: '', apt: false };
    s = s.replace(/\s/g, '');
    let m = s.match(/^제?(\d{1,4})(동)?$/) || s.match(/(\d{1,4})동$/);
    if (m) return { text: m[1] + '동', apt: true };
    m = s.match(/^([A-Za-z가-하])동?$/);
    if (m) return { text: m[1] + '동', apt: true };
    return { text: s, apt: false };
  }
  function fid(f) {
    if (f.id) return String(f.id);
    const p = f.properties || {};
    return p.pnu || JSON.stringify(f.geometry.coordinates).slice(0, 80);
  }
  function safeInside(pt, poly) {
    try { return turf.booleanPointInPolygon(pt, poly); } catch (e) { return false; }
  }
  function ptOf(f) {
    try { return turf.pointOnFeature(f); } catch (e) { return turf.centroid(f); }
  }

  // ---------- 상태 ----------
  const state = {
    parcels: new Map(),   // pnu -> 필지 feature
    buildings: new Map(), // id -> 건물 feature
    drawn: [],            // 지도에 그린 것들
    labels: [],
    marker: null,
    manual: false
  };

  let map, ps;

  loadKakao(cfg.kakao).then(() => {
    map = new kakao.maps.Map($('map'), { center: new kakao.maps.LatLng(37.5665, 126.978), level: 5 });
    ps = new kakao.maps.services.Places();
    kakao.maps.event.addListener(map, 'click', (e) => { if (state.manual) toggleParcel(e.latLng); });
    kakao.maps.event.addListener(map, 'zoom_changed', updateLabelVisibility);
    setStatus('준비 완료. ② 에서 단지를 검색하세요.');
    log('도메인: ' + cfg.domain);
  }).catch((e) => setStatus(e.message, true));

  // ---------- 검색 ----------
  function search() {
    const q = $('q').value.trim();
    if (!q || !ps) return;
    ps.keywordSearch(q, (data, status) => {
      const ul = $('results');
      ul.innerHTML = '';
      if (status !== kakao.maps.services.Status.OK) { ul.innerHTML = '<li>검색 결과 없음</li>'; return; }
      data.sort((a, b) => (b.category_name.includes('아파트') ? 1 : 0) - (a.category_name.includes('아파트') ? 1 : 0));
      data.forEach((p) => {
        const li = document.createElement('li');
        const isApt = p.category_name.includes('아파트');
        li.innerHTML = '<span class="nm"></span>' + (isApt ? '<span class="apt">아파트</span>' : '') + '<div class="ad"></div>';
        li.querySelector('.nm').textContent = p.place_name;
        li.querySelector('.ad').textContent = p.road_address_name || p.address_name;
        li.onclick = () => drawComplex(p);
        ul.appendChild(li);
      });
    }, { size: 15 });
  }
  $('searchBtn').onclick = search;
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') search(); });

  // ---------- 단지 그리기 ----------
  function boxAround(lng, lat, r) {
    const dLat = r / 111000;
    const dLng = r / (111000 * Math.cos(lat * Math.PI / 180));
    return 'BOX(' + (lng - dLng) + ',' + (lat - dLat) + ',' + (lng + dLng) + ',' + (lat + dLat) + ')';
  }

  function selectComplexBuildings(blds, place, lng, lat) {
    const target = norm(place.place_name);
    const here = turf.point([lng, lat]);
    const info = blds.map((b) => {
      const p = b.properties || {};
      const name = pick(p, NAME_KEYS);
      return { b: b, name: name, n: norm(name), fl: Number(pick(p, FLOOR_KEYS)) || 0, d: turf.distance(here, ptOf(b), { units: 'meters' }) };
    });
    let sel = info.filter((x) => x.n.length >= 2 && (x.n.includes(target) || (x.n.length >= 4 && target.includes(x.n))));
    let how = '이름 일치 (' + target + ')';
    if (!sel.length) {
      const tall = info.filter((x) => x.fl >= 5).sort((a, c) => a.d - c.d);
      if (tall.length && tall[0].n) {
        sel = info.filter((x) => x.n === tall[0].n);
        how = '가장 가까운 5층 이상 건물의 이름 (' + tall[0].name + ')';
      } else {
        sel = tall.filter((x) => x.d <= 150);
        how = '150m 안 5층 이상 건물';
      }
    }
    log('단지 건물 고른 방법: ' + how + ' → ' + sel.length + '개');
    return sel.map((x) => x.b);
  }

  async function drawComplex(place) {
    clearAll();
    const lng = Number(place.x), lat = Number(place.y);
    map.setCenter(new kakao.maps.LatLng(lat, lng));
    map.setLevel(3);
    state.marker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(lat, lng), map: map });
    log('\n===== ' + place.place_name + ' (' + lng + ', ' + lat + ') =====');

    try {
      setStatus('주변 건물 불러오는 중…');
      const blds = await fetchAll($('bldLayer').value, boxAround(lng, lat, Number($('radius').value)));
      log('주변 건물 수: ' + blds.length);
      if (blds[0]) log('건물 속성 예시 1:', blds[0].properties);
      if (blds[1]) log('건물 속성 예시 2:', blds[1].properties);
      if (!blds.length) { setStatus('주변 건물 데이터를 받지 못했습니다.\n건물 데이터 종류를 바꾸거나, ④ 수동 모드로 필지를 눌러 보세요.', true); return; }

      const sel = selectComplexBuildings(blds, place, lng, lat);
      if (!sel.length) { setStatus('이 단지의 건물을 찾지 못했습니다.\n반경을 늘리거나 ④ 수동 모드를 써 보세요.', true); return; }

      setStatus('필지(땅 경계) 불러오는 중…');
      const bb = turf.bbox(turf.featureCollection(sel));
      const pad = 0.0002;
      const parcels = await fetchAll('LP_PA_CBND_BUBUN', 'BOX(' + (bb[0] - pad) + ',' + (bb[1] - pad) + ',' + (bb[2] + pad) + ',' + (bb[3] + pad) + ')');
      log('주변 필지 수: ' + parcels.length);
      if (parcels[0]) log('필지 속성 예시:', parcels[0].properties);

      const pts = sel.map(ptOf);
      parcels.forEach((pc) => {
        if (pts.some((pt) => safeInside(pt, pc))) state.parcels.set((pc.properties && pc.properties.pnu) || fid(pc), pc);
      });
      blds.forEach((b) => state.buildings.set(fid(b), b));
      log('단지 필지 수: ' + state.parcels.size);

      redraw(true);
    } catch (e) {
      setStatus(e.message, true);
      log('오류: ' + e.message);
    }
  }

  // ---------- 수동: 필지 추가/빼기 ----------
  async function toggleParcel(latLng) {
    const lng = latLng.getLng(), lat = latLng.getLat();
    try {
      setStatus('필지 확인 중…');
      const f = featuresOf(await vworld({ data: 'LP_PA_CBND_BUBUN', geomFilter: 'POINT(' + lng + ' ' + lat + ')' }));
      if (!f.length) { setStatus('이 위치의 필지를 찾지 못했습니다.', true); return; }
      const pc = f[0];
      const key = (pc.properties && pc.properties.pnu) || fid(pc);
      if (state.parcels.has(key)) {
        state.parcels.delete(key);
        log('필지 빼기: ' + JSON.stringify(pc.properties));
      } else {
        state.parcels.set(key, pc);
        log('필지 추가: ' + JSON.stringify(pc.properties));
        const bb = turf.bbox(pc);
        const blds = await fetchAll($('bldLayer').value, 'BOX(' + bb[0] + ',' + bb[1] + ',' + bb[2] + ',' + bb[3] + ')');
        blds.forEach((b) => state.buildings.set(fid(b), b));
      }
      redraw(false);
    } catch (e) {
      setStatus(e.message, true);
    }
  }

  // ---------- 그리기 ----------
  function toPaths(geom) {
    const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.type === 'MultiPolygon' ? geom.coordinates : [];
    return polys.map((rings) => rings.map((r) => r.map((c) => new kakao.maps.LatLng(c[1], c[0]))));
  }
  function addPolygon(geom, style) {
    toPaths(geom).forEach((path) => {
      const pg = new kakao.maps.Polygon(Object.assign({ path: path, map: map }, style));
      state.drawn.push(pg);
    });
  }
  function unionAll(list) {
    if (!list.length) return null;
    let u = null;
    for (const f of list) {
      let g = f;
      try { g = turf.buffer(f, 0.5, { units: 'meters' }); } catch (e) { /* 그대로 사용 */ }
      try { u = u ? turf.union(u, g) : g; } catch (e) { log('합치기 실패: ' + e.message); }
    }
    try { const shrunk = turf.buffer(u, -0.5, { units: 'meters' }); if (shrunk) u = shrunk; } catch (e) { /* 그대로 사용 */ }
    return u;
  }

  function clearDrawn() {
    state.drawn.forEach((d) => d.setMap(null));
    state.drawn = [];
    state.labels.forEach((o) => o.setMap(null));
    state.labels = [];
  }
  function clearAll() {
    clearDrawn();
    state.parcels.clear();
    state.buildings.clear();
    if (state.marker) { state.marker.setMap(null); state.marker = null; }
  }

  function redraw(fit) {
    clearDrawn();
    const parcels = [...state.parcels.values()];
    if (!parcels.length) { setStatus('단지 필지가 없습니다. ④ 수동 모드로 필지를 눌러 추가해 보세요.'); return; }

    // 단지 경계선
    const u = unionAll(parcels);
    if (u) addPolygon(u.geometry, { strokeWeight: 3, strokeColor: '#e5322d', strokeOpacity: 1, fillColor: '#e5322d', fillOpacity: 0.07 });

    // 확인용: 필지 하나하나
    if ($('optParcel').checked) {
      parcels.forEach((pc) => addPolygon(pc.geometry, { strokeWeight: 1, strokeColor: '#2563eb', strokeStyle: 'dash', strokeOpacity: 0.9, fillOpacity: 0 }));
    }

    // 단지 안의 건물
    const inside = [...state.buildings.values()].filter((b) => {
      const pt = ptOf(b);
      return parcels.some((pc) => safeInside(pt, pc));
    });

    if ($('optBld').checked) {
      inside.forEach((b) => addPolygon(b.geometry, { strokeWeight: 1, strokeColor: '#555', strokeOpacity: 0.8, fillColor: '#999', fillOpacity: 0.25 }));
    }

    // 동 번호
    let aptCount = 0, otherCount = 0, noName = 0;
    const seen = new Set();
    if ($('optDong').checked) {
      inside.forEach((b) => {
        const lb = dongLabel(b.properties);
        if (!lb.text) { noName++; return; }
        if (!lb.apt && !$('optOther').checked) { otherCount++; return; }
        const pt = ptOf(b).geometry.coordinates;
        const key = lb.text + '@' + pt[0].toFixed(4) + ',' + pt[1].toFixed(4);
        if (seen.has(key)) return;
        seen.add(key);
        const el = document.createElement('div');
        el.className = 'dong' + (lb.apt ? '' : ' other');
        el.textContent = lb.text;
        const ov = new kakao.maps.CustomOverlay({ position: new kakao.maps.LatLng(pt[1], pt[0]), content: el, yAnchor: 1, zIndex: lb.apt ? 3 : 2 });
        ov.setMap(map);
        state.labels.push(ov);
        if (lb.apt) aptCount++; else otherCount++;
      });
    }
    updateLabelVisibility();

    if (fit && u) {
      const bb = turf.bbox(u);
      const bounds = new kakao.maps.LatLngBounds(new kakao.maps.LatLng(bb[1], bb[0]), new kakao.maps.LatLng(bb[3], bb[2]));
      map.setBounds(bounds, 40, 40, 40, 40);
    }

    setStatus('완료\n· 단지 필지: ' + parcels.length + '개\n· 단지 안 건물: ' + inside.length + '개\n· 표시한 아파트 동 번호: ' + aptCount + '개\n· 동 이름이 없는 건물: ' + noName + '개\n· 상가·관리동 등: ' + otherCount + '개');
  }

  function updateLabelVisibility() {
    if (!map) return;
    const show = map.getLevel() <= 5;
    state.labels.forEach((o) => o.setMap(show ? map : null));
  }

  ['optDong', 'optOther', 'optParcel', 'optBld'].forEach((id) => { $(id).onchange = () => redraw(false); });

  $('manualBtn').onclick = () => {
    state.manual = !state.manual;
    $('manualBtn').textContent = '지도 클릭으로 필지 추가/빼기: ' + (state.manual ? '켜짐' : '꺼짐');
    $('manualBtn').className = state.manual ? 'on' : 'gray';
  };
  $('clearBtn').onclick = () => { clearAll(); setStatus('지웠습니다.'); };
})();
</script>
</body>
</html>
