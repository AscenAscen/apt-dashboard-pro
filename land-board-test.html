<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>랜드마크 판 시험 페이지</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .lbt { max-width: 2200px; margin: 0 auto; padding: 14px 16px 60px; }
  .lbt h1 { font-size: 18px; margin: 0 0 4px; }
  .lbt .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
  .lbt .bar button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
  .lbt #msg { color: var(--sub); font-size: 12px; margin: 4px 0 10px; line-height: 1.6; }
  .lbt #msg b { color: var(--text); }
  .lbt .err { color: var(--danger); }

  /* ── 판(보드): 엑셀 그림처럼 흰 바탕에 검은 선. 테마와 상관없이 같은 모양 → 캡처·이미지 저장에도 그대로 ── */
  .lbt .boardwrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 0 0 14px; }
  .lbt .bhead { display: flex; align-items: center; gap: 16px; background: #ccff66; color: #111; padding: 6px 14px; margin: 14px 14px 12px; min-width: min-content; }
  .lbt .bhead b { font-size: 20px; flex: 1; text-align: center; letter-spacing: 1px; }
  .lbt .bhead small { color: #333; white-space: nowrap; }
  .lbt .legend { display: flex; flex-wrap: wrap; gap: 3px; margin: 0 14px 10px; font-size: 11px; color: #111; }
  .lbt .legend span { padding: 1px 8px; border: 1px solid #111; min-width: 54px; text-align: center; }
  .lbt .grid { display: grid; margin: 0 14px; grid-auto-rows: 23px; width: max-content; }
  .lbt .cell { border: 1px solid #111; background: #fff; color: #111; display: grid; grid-template-rows: 23px 23px 23px; cursor: pointer; min-width: 0; font-size: 12px; margin: 0 -1px -1px 0; }
  .lbt .cell:hover { outline: 2px solid #2563eb; outline-offset: -2px; z-index: 2; }
  .lbt .cell.sel { outline: 3px solid #2563eb; outline-offset: -3px; z-index: 3; }
  .lbt .cell .r1 { display: flex; align-items: center; justify-content: center; gap: 4px; font-weight: 600; padding: 0 4px; white-space: nowrap; overflow: hidden; }
  .lbt .cell .r2 { display: flex; align-items: center; justify-content: center; gap: 3px; padding: 0 4px; font-size: 11px; min-width: 0; }
  .lbt .cell .r2 span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .lbt .cell .r2 small { color: #555; flex: none; font-size: 10px; }
  .lbt .cell .r3 { display: flex; align-items: center; justify-content: center; gap: 5px; font-weight: 700; white-space: nowrap; overflow: hidden; }
  .lbt .cell .r3 i { font-style: normal; font-weight: 400; font-size: 10px; opacity: .85; }
  .lbt .cell .r3 i.old { color: #ff0000; font-weight: 700; opacity: 1; background: rgba(255,255,255,.85); padding: 0 3px; border-radius: 3px; }
  .lbt .cell .plus { background: #111; color: #fff; border-radius: 8px; font-size: 10px; padding: 0 5px; font-weight: 700; }
  .lbt .cell.empty { border-color: #bbb; color: #999; cursor: default; }
  .lbt .cell.empty:hover { outline: 0; }
  .lbt .cell.empty .r3 { background: #f1f1f1; font-weight: 400; font-size: 11px; color: #aaa; }

  .lbt .panel h3 { margin: 0 0 8px; font-size: 14px; }
  .lbt td.l, .lbt th.l { text-align: left; }
  .lbt .bands { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 6px 0; }
  .lbt .bands input { width: 62px; }
  .lbt .bands .sw { display: inline-block; width: 14px; height: 14px; border: 1px solid #888; vertical-align: -2px; margin-right: 3px; }
  .lbt .dn { color: var(--down); } .lbt .up { color: var(--up); }
</style>
</head>
<body>
<main class="lbt">
  <h1>🗺 랜드마크 판 — 시험 페이지</h1>
  <p class="hint">랜드마크 탭에 <b>S(대표)</b>로 등록한 단지가 <b>최근 실거래가 + 거래일</b>과 함께 시군구 칸에 자동으로 들어갑니다. (이 브라우저에 저장된 랜드마크를 읽어요 · 이 페이지는 아무것도 바꾸거나 저장하지 않고, 색 구간만 따로 기억합니다)</p>
  <div class="bar">
    <button id="bMetro" class="on">수도권</button>
    <button id="bLocal">지방</button>
    <button id="bBands">색 구간 설정</button>
  </div>
  <div id="msg">불러오는 중…</div>
  <div class="boardwrap"><div id="boardHost"></div></div>
  <section class="panel" id="detail" hidden style="margin-top:14px"></section>
  <section class="panel" id="bandBox" hidden style="margin-top:14px"></section>
  <section class="panel" id="orph" hidden style="margin-top:14px"></section>
</main>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/kit.js"></script>

  for (const k of Object.keys(BOARDS)) BOARDS[k].cells.forEach((cell, i) => cell.codes.forEach(cd => cellOf[k].set(cd, i)));
  const inCell = (k, i) => infos.filter(x => cellOf[k].get(x.l.code) === i)
    .sort((a, b) => (b.sale ? b.sale.price : -1) - (a.sale ? a.sale.price : -1));      // 가격 높은 단지가 칸의 대표

  /* ── 표시 도구 ── */
  const eok = (v) => String(+(v / 10000).toFixed(2));
  const pyeong = (g) => CONFIG.toPyeong(g) + '평';
  const ymdDate = (d) => new Date(Math.floor(d / 10000), Math.floor(d / 100) % 100 - 1, d % 100);
  const nowY = new Date().getFullYear();
  const fmtDate = (d) => { const y = Math.floor(d / 10000), m = Math.floor(d / 100) % 100, dd = d % 100; return y === nowY ? `${m}/${dd}` : `${String(y).slice(2)}.${m}/${dd}`; };
  const isOld = (d) => (Date.now() - ymdDate(d).getTime()) / 86400000 > STALE_DAYS;
  const bandOf = (b, v) => { const i = b.bounds.findIndex(x => v / 10000 <= x); return i < 0 ? b.bounds.length : i; };
  const ink = (hex) => { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, bl = n & 255; return (0.299 * r + 0.587 * g + 0.114 * bl) < 140 ? '#fff' : '#111'; };

  let cur = 'metro', selCell = -1;

  function legend(b) {
    const bs = b.bounds, out = [];
    for (let i = 0; i <= bs.length; i++) {
      const txt = i === bs.length ? `${bs[i - 1]}억~` : i === 0 ? `~${bs[0]}억` : `${bs[i - 1]}~${bs[i]}억`;
      out.push(`<span style="background:${COLORS[i]};color:${ink(COLORS[i])}">${txt}</span>`);
    }
    return out.reverse().join('');
  }

  function drawBoard() {
    const b = BOARDS[cur];
    const newest = infos.reduce((m, x) => Math.max(m, x.sale ? x.sale.d : 0), 0);
    const cells = b.cells.map((cell, i) => {
      const list = inCell(cur, i), top = list[0];
      const style = `grid-column:${cell.col + 1};grid-row:${cell.row + 1} / span 3`;
      if (!top) return `<div class="cell empty" style="${style}" title="${esc(cell.n)} — S 단지 없음"><div class="r1">${esc(cell.n)}</div><div class="r2"></div><div class="r3">미등록</div></div>`;
      const p = top.sale, extra = list.length - 1;
      const bg = p ? COLORS[bandOf(b, p.price)] : '#eee';
      const price = p ? `${eok(p.price)}억 <i class="${isOld(p.d) ? 'old' : ''}">${fmtDate(p.d)}</i>` : '<span style="font-weight:400;color:#777">거래 없음</span>';
      return `<div class="cell${selCell === i ? ' sel' : ''}" data-i="${i}" style="${style}" title="${esc(top.l.name)} ${pyeong(top.l.g)} (${top.l.g}㎡)${p ? ` · 실거래 ${p.price.toLocaleString()}만원 · ${p.d}` : ''}">
        <div class="r1">${esc(cell.n)}${extra ? `<span class="plus">+${extra}</span>` : ''}</div>
        <div class="r2"><span>${esc(top.l.name)}</span><small>${pyeong(top.l.g)}</small></div>
        <div class="r3" style="background:${bg};color:${ink(bg)}">${price}</div></div>`;
    }).join('');
    $('boardHost').innerHTML = `
      <div class="bhead"><b>${esc(b.title)}</b><small>최근 실거래 기준${newest ? ' · 가장 최근 거래 ' + fmtDate(newest) : ''}${st && st.updatedAt ? ' · 자료 갱신 ' + esc(st.updatedAt) : ''}</small></div>
      <div class="legend">${legend(b)}</div>
      <div class="grid" style="grid-template-columns:repeat(${b.cols},128px)">${cells}</div>`;
    $('boardHost').querySelectorAll('.cell[data-i]').forEach(el => el.onclick = () => { selCell = +el.dataset.i; drawBoard(); drawDetail(); });
  }

  function drawDetail() {
    const box = $('detail'), b = BOARDS[cur], cell = b.cells[selCell];
    if (!cell) { box.hidden = true; return; }
    const list = inCell(cur, selCell);
    box.hidden = false;
    box.innerHTML = `<h3>${esc(cell.n)} — S(대표) 단지 ${list.length}개</h3>
      <div class="tablewrap short"><table><thead><tr><th class="l">단지</th><th>평형</th><th>최근 실거래</th><th>거래일</th><th>층</th><th>전고점</th><th>전고 대비</th><th>30일 거래</th><th>90일 거래</th></tr></thead><tbody>${list.map(x => {
        const p = x.sale, pk = x.peak, dr = p && pk ? (p.price / pk.price - 1) * 100 : null;
        return `<tr><td class="l"><b>${esc(x.l.name)}</b><small> ${esc(x.l.sgg || '')} ${esc(x.l.dong || '')}</small></td><td>${x.l.g}㎡<small> ${pyeong(x.l.g)}</small></td>
          <td>${p ? eok(p.price) + '억' : '-'}</td><td>${p ? fmtDate(p.d) : '-'}</td><td>${p ? p.floor : '-'}</td><td>${pk ? eok(pk.price) + '억' : '-'}</td>
          <td class="${dr == null ? '' : dr < 0 ? 'dn' : 'up'}">${dr == null ? '-' : (dr > 0 ? '+' : '') + dr.toFixed(1) + '%'}</td><td>${x.rl.n30 ?? '-'}</td><td>${x.rl.n90 ?? '-'}</td></tr>`;
      }).join('')}</tbody></table></div>
      <p class="hint">칸에는 이 중 <b>최근 실거래가가 가장 높은 단지</b>가 보입니다. 직거래는 빼고 센 값이에요.</p>`;
  }

  function drawBands() {
    const box = $('bandBox');
    box.innerHTML = `<h3>색 구간 설정 (억 단위, 작은 값부터)</h3>` + ['metro', 'local'].map(k => `
      <div class="bands"><b style="min-width:62px">${k === 'metro' ? '수도권' : '지방'}</b>${BOARDS[k].bounds.map((v, i) => `<span><i class="sw" style="background:${COLORS[i]}"></i>~<input type="number" step="0.5" min="0" data-k="${k}" data-i="${i}" value="${v}">억</span>`).join('')}<span><i class="sw" style="background:${COLORS[7]}"></i>그 이상</span></div>`).join('') +
      `<div class="bands"><button id="bSave" class="primary">저장</button><button id="bReset">처음 값으로</button><span id="bMsg" class="hint"></span></div>
      <p class="hint">저장하면 이 브라우저에 기억합니다. 구간은 앞에서부터 커지는 값이어야 해요.</p>`;
    $('bSave').onclick = () => {
      const nb = { metro: [], local: [] };
      box.querySelectorAll('input[data-k]').forEach(el => { nb[el.dataset.k][+el.dataset.i] = parseFloat(el.value); });
      for (const k of ['metro', 'local']) if (nb[k].some(x => !(x >= 0)) || nb[k].some((x, i) => i && x <= nb[k][i - 1])) { $('bMsg').innerHTML = '<span class="err">구간이 작은 값부터 커지는지 확인해 주세요.</span>'; return; }
      BOARDS.metro.bounds = nb.metro; BOARDS.local.bounds = nb.local; Store.set(BKEY, nb); $('bMsg').textContent = '저장했어요.'; drawBoard();
    };
    $('bReset').onclick = () => { BOARDS.metro.bounds = DEF_BOUNDS.metro.slice(); BOARDS.local.bounds = DEF_BOUNDS.local.slice(); Store.remove(BKEY); drawBands(); drawBoard(); };
  }

  function drawOrphans() {
    const box = $('orph'), orphans = infos.filter(x => cellOf.metro.get(x.l.code) == null && cellOf.local.get(x.l.code) == null);
    const nm = infos.filter(x => cellOf.metro.get(x.l.code) != null).length, nl = infos.filter(x => cellOf.local.get(x.l.code) != null).length;
    $('msg').innerHTML = S.length ? `S(대표) 등록 단지 <b>${S.length}개</b> → 수도권 판 <b>${nm}개</b> · 지방 판 <b>${nl}개</b> · 칸 없음 <b>${orphans.length}개</b>${missingNames.length ? ` · <span class="err">지역 이름을 못 찾은 칸: ${esc(missingNames.join(', '))}</span>` : ''}<br>칸을 누르면 아래에 상세가 열려요. 빨간 날짜는 ${Math.round(STALE_DAYS / 30.5)}개월보다 오래된 실거래입니다.` : $('msg').innerHTML;
    if (!orphans.length) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = `<h3>판에 칸이 없는 S 단지 (${orphans.length}개)</h3><p class="hint">이 단지들은 지금 두 판 어디에도 시군구 칸이 없어요. 본 구현에서 칸을 추가할 수 있게 만듭니다.</p>
      <div class="tablewrap short"><table><thead><tr><th class="l">지역</th><th class="l">단지</th><th>평형</th><th>최근 실거래</th><th>거래일</th></tr></thead><tbody>${orphans.map(x => `<tr><td class="l">${esc(x.l.sido || '')} ${esc(x.l.sgg || '')}</td><td class="l">${esc(x.l.name)}</td><td>${x.l.g}㎡</td><td>${x.sale ? eok(x.sale.price) + '억' : '-'}</td><td>${x.sale ? fmtDate(x.sale.d) : '-'}</td></tr>`).join('')}</tbody></table></div>`;
  }

  function setBoard(k) { cur = k; selCell = -1; $('bMetro').classList.toggle('on', k === 'metro'); $('bLocal').classList.toggle('on', k === 'local'); drawBoard(); drawDetail(); }
  $('bMetro').onclick = () => setBoard('metro');
  $('bLocal').onclick = () => setBoard('local');
  $('bBands').onclick = () => { const b = $('bandBox'); b.hidden = !b.hidden; if (!b.hidden) drawBands(); };
  drawOrphans(); drawBoard();
  window.__landBoard = { S, infos, BOARDS };
})().catch(e => { console.error(e); document.getElementById('msg').innerHTML = '<span class="err">오류: ' + String(e && e.message || e) + '</span>'; });
</script>
</body>
</html>
